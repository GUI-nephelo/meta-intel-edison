name: Build snd-usb-audio for Edison (v3 - robust)

on:
  push:
    branches:
      - snd-usb-audio
    paths:
      - '.github/workflows/build-snd-usb-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (with retries)
        run: |
          set -e
          for i in {1..3}; do
            echo "Attempt $i to install dependencies..."
            if sudo apt-get update && sudo apt-get install -y \
              build-essential flex bison libelf-dev libssl-dev bc \
              libncurses-dev libncurses5 libncursesw5 wget; then
              echo "Success"
              break
            fi
            sleep 5
          done

      - name: Download kernel source
        run: |
          cd /tmp
          echo "Downloading linux-6.12.3..."
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.3.tar.xz
          tar -xf linux-6.12.3.tar.xz
          cd linux-6.12.3
          ls -la | head -10

      - name: Configure for audio modules
        run: |
          cd /tmp/linux-6.12.3
          
          # Start with defconfig
          make defconfig >/dev/null 2>&1
          
          # Add Edison-specific settings
          cat >> .config << 'EOF'
CONFIG_SND=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_HWDEP=m
CONFIG_SND_RAWMIDI=m
CONFIG_LOCALVERSION="-edison-acpi-preempt-rt"
# CONFIG_LOCALVERSION_AUTO is not set
EOF
          
          # Normalize config
          make oldconfig < /dev/null >/dev/null 2>&1
          
          echo "=== Audio Config ==="
          grep -E "CONFIG_SND_USB_AUDIO|CONFIG_LOCALVERSION" .config

      - name: Build kernel and modules
        run: |
          cd /tmp/linux-6.12.3
          echo "Starting build with $(nproc) CPUs..."
          time make -j$(nproc) 2>&1 | tee build.log | tail -30
          
          if [ -f vmlinux ]; then
            echo "✓ Kernel built successfully"
          else
            echo "✗ Kernel build failed!"
            tail -50 build.log
            exit 1
          fi

      - name: Locate modules
        run: |
          cd /tmp/linux-6.12.3
          
          echo "=== Searching for modules ==="
          MODULES_COUNT=$(find . -name "*.ko" | wc -l)
          echo "Total .ko files found: $MODULES_COUNT"
          
          TARGET_MODULES=(
            "snd-usb-audio.ko"
            "snd-hwdep.ko"
            "snd-rawmidi.ko"
            "snd-usbmidi-lib.ko"
          )
          
          FOUND_ALL=1
          for target in "${TARGET_MODULES[@]}"; do
            FOUND=$(find . -name "$target" 2>/dev/null)
            if [ -z "$FOUND" ]; then
              echo "✗ Missing: $target"
              FOUND_ALL=0
            else
              echo "✓ Found: $target"
              echo "  Path: $FOUND"
            fi
          done
          
          if [ $FOUND_ALL -eq 0 ]; then
            echo ""
            echo "Listing all snd*.ko files found:"
            find . -name "snd*.ko" 2>/dev/null | head -20
            exit 1
          fi

      - name: Copy modules
        run: |
          mkdir -p ${{ github.workspace }}/modules
          cd /tmp/linux-6.12.3
          
          for target in snd-usb-audio.ko snd-hwdep.ko snd-rawmidi.ko snd-usbmidi-lib.ko; do
            FOUND=$(find . -name "$target" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" ${{ github.workspace }}/modules/
              echo "Copied: $(basename $FOUND)"
            fi
          done
          
          echo ""
          echo "=== Modules ready for packaging ==="
          ls -lh ${{ github.workspace }}/modules/

      - name: Verify module metadata
        run: |
          echo "=== Module Information ==="
          for ko in ${{ github.workspace }}/modules/*.ko; do
            if [ -f "$ko" ]; then
              echo ""
              echo "File: $(basename $ko)"
              echo "Size: $(stat -c %s $ko 2>/dev/null || stat -f %z $ko 2>/dev/null) bytes"
              
              # Try modinfo if available
              if modinfo "$ko" >/dev/null 2>&1; then
                modinfo "$ko" | grep -E "^(filename|vermagic|depends):" | head -3
              else
                file "$ko"
              fi
            fi
          done

      - name: Create install script
        run: |
          mkdir -p ${{ github.workspace }}/output
          cp ${{ github.workspace }}/modules/*.ko ${{ github.workspace }}/output/
          
          cat > ${{ github.workspace }}/output/INSTALL.sh << 'INSTALL_SCRIPT'
#!/bin/bash
# Installation script for Edison snd-usb-audio modules
set -e

KVER="6.12.3-edison-acpi-preempt-rt"
MODDIR="/lib/modules/$KVER/extra"

echo "Installing modules for kernel: $KVER"
mkdir -p "$MODDIR"

for ko in $(dirname $0)/*.ko; do
  if [ -f "$ko" ]; then
    echo "Installing: $(basename $ko)"
    cp "$ko" "$MODDIR/"
  fi
done

echo "Running depmod..."
depmod -a "$KVER"

echo "Installation complete!"
echo "To load modules:"
echo "  modprobe snd-hwdep"
echo "  modprobe snd-rawmidi"  
echo "  modprobe snd-usb-audio"
INSTALL_SCRIPT
          
          chmod +x ${{ github.workspace }}/output/INSTALL.sh

      - name: List artifacts
        run: |
          echo "=== Artifacts to upload ==="
          ls -lah ${{ github.workspace }}/output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snd-usb-audio-edison-6.12.3
          path: output/
          retention-days: 90
