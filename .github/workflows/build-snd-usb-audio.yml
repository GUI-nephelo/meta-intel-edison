name: Build snd-usb-audio for Edison

on:
  push:
    branches:
      - snd-usb-audio
    paths:
      - '.github/workflows/build-snd-usb-audio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gcc:13
      options: --user root

    steps:
      - name: Install dependencies
        run: |
          echo "Installing build dependencies..."
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git curl xz-utils bc flex bison libelf-dev libssl-dev ca-certificates make
          echo "Dependencies installed"
          gcc --version | head -1
          make --version | head -1

      - uses: actions/checkout@v4

      - name: Download kernel source
        run: |
          cd /tmp
          echo "Fetching kernel..."
          curl -f -L -o linux-6.12.3.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.3.tar.xz
          echo "Extracting..."
          tar -xf linux-6.12.3.tar.xz
          cd linux-6.12.3
          echo "Done: $(pwd)"
          ls -la | head -10

      - name: Configure kernel
        run: |
          cd /tmp/linux-6.12.3
          echo "Running defconfig..."
          make defconfig -j4
          
          echo "Adding audio config..."
          cat >> .config << 'CONFIG_EOF'
CONFIG_SND=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_HWDEP=m
CONFIG_SND_RAWMIDI=m
CONFIG_LOCALVERSION="-edison-acpi-preempt-rt"
# CONFIG_LOCALVERSION_AUTO is not set
CONFIG_EOF
          
          echo "Finalizing config..."
          yes | make oldconfig -j4
          
          echo "=== Final Configuration ==="
          grep "CONFIG_SND_USB_AUDIO\|CONFIG_LOCALVERSION\|CONFIG_LOCALVERSION_AUTO" .config

      - name: Build prepare (kernel headers)
        run: |
          cd /tmp/linux-6.12.3
          echo "Building kernel infrastructure for modules..."
          make -j4 modules_prepare
          echo "Done"

      - name: Full kernel build
        run: |
          cd /tmp/linux-6.12.3
          echo "=== Starting full build ===" 
          echo "CPUs: $(nproc)"
          
          # Show first error if it occurs
          make -j2 2>&1 | \
            tee /tmp/build.log | \
            grep -E "^(  CC|  AS|  LD|error:|undefined reference|cannot find)" | \
            tail -30

      - name: Check build status
        run: |
          cd /tmp/linux-6.12.3
          if [ -f vmlinux ]; then
            echo "✓ vmlinux built"
            ls -lh vmlinux
          else
            echo "✗ vmlinux MISSING - showing last errors"
            tail -50 /tmp/build.log | grep -i error || tail -50 /tmp/build.log
            exit 1
          fi

      - name: Collect modules
        run: |
          cd /tmp/linux-6.12.3
          mkdir -p /tmp/output
          
          echo "Finding audio modules..."
          count=0
          for mod in snd-usb-audio snd-hwdep snd-rawmidi snd-usbmidi-lib; do
            find . -name "${mod}.ko" -type f -exec cp {} /tmp/output/ \; && {
              count=$((count + 1))
              echo "✓ Copied ${mod}.ko"
            }
          done
          
          if [ $count -eq 0 ]; then
            echo "✗ ERROR: No modules found!"
            echo "Listing all .ko files:"
            find . -name "*.ko" -type f 2>/dev/null | head -20
            exit 1
          fi

      - name: Verify modules
        run: |
          cd /tmp/output
          echo "=== Modules Ready ===" 
          ls -lah *.ko
          file *.ko | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snd-usb-audio-edison-6.12.3
          path: /tmp/output/
