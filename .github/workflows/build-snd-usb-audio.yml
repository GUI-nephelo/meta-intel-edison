name: Build snd-usb-audio kernel module

on:
  workflow_dispatch:
  push:
    branches: [snd-usb-audio]
    paths:
      - '.github/workflows/build-snd-usb-audio.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev zstd

      - name: Checkout meta-intel-edison
        uses: actions/checkout@v4

      - name: Clone kernel v6.12.3
        run: |
          git clone --depth 1 --branch v6.12.3 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux-src
          cd linux-src
          echo "Kernel version: $(make kernelrelease 2>/dev/null || cat Makefile | head -5)"

      - name: Apply Edison patches
        working-directory: linux-src
        run: |
          CFG_DIR="${GITHUB_WORKSPACE}/meta-intel-edison-bsp/recipes-kernel/linux/files"
          PATCHES=(
            "0044-REVERTME-usb-dwc3-gadget-skip-endpoints-ep-18-in-out.patch"
            "0001-8250_mid-arm-rx-dma-on-all-ports-with-dma-continousl.patch"
            "0001a-usb-dwc3-core-Fix-dwc3_core_soft_reset-before-anythi.patch"
            "0001-phy-ti-tusb1210-write-to-scratch-on-power-on.patch"
            "0092-platform-x86-intel_scu_ipc-Replace-workaround-by-32-.patch"
            "0093-platform-x86-intel_scu_ipc-Simplify-code-with-cleanu.patch"
            "0094-platform-x86-intel_scu_ipc-Save-a-copy-of-the-entire.patch"
          )
          for p in "${PATCHES[@]}"; do
            echo "Applying $p"
            git apply "${CFG_DIR}/${p}" || echo "WARN: $p did not apply cleanly"
          done

      - name: Build kernel config
        working-directory: linux-src
        run: |
          CFG_DIR="${GITHUB_WORKSPACE}/meta-intel-edison-bsp/recipes-kernel/linux/files"

          make x86_64_defconfig

          FRAGMENTS=(
            0001-enable-to-build-a-netboot-image.cfg
            0002-enable-x2APIC.cfg
            0003-enable-NETCONSOLE_DYNAMIC.cfg
            0004-enable-STMMAC.cfg
            0005-enable-IGB.cfg
            0006-enable-IXGBE.cfg
            0007-enable-USB_RTL8152.cfg
            0008-disable-HPET.cfg
            0009-disable-i915-DRM.cfg
            0010-enable-X86_INTEL_MID.cfg
            0011-enable-INPUT_SOC_BUTTON_ARRAY.cfg
            0012-enable-I2C-HID-and-HID_MULTITOUCH.cfg
            0013-DEBUG_SHIRQ-DEBUG_LOCKDEP.cfg
            0014-enable-ACPI_DEBUG-and-ACPI_PROCFS_POWER.cfg
            0015-enable-ACPI_TABLE_UPGRADE.cfg
            0016-enable-X86_INTEL_LPSS-and-LPSS-drivers.cfg
            0017-enable-MFD_INTEL_LPSS-drivers.cfg
            0018-enable-INTEL_IDMA64-iDMA-64-bit.cfg
            0020-enable-SPI_DW.cfg
            0021-disable-HDA-audio.cfg
            0022-enable-Intel-Quark-devices.cfg
            0023-enable-DEBUG_GPIO.cfg
            0024-enable-GPIO_DWAPB.cfg
            0025-enable-GPIO_PCA953X.cfg
            0029-enable-INTEL_IDLE.cfg
            0030-enable-PUNIT_ATOM_DEBUG.cfg
            0031-enable-REGULATOR.cfg
            0032-enable-BRCMFMAC.cfg
            0033-enable-BT_HCIUART_BCM.cfg
            0034-enable-ADS7950.cfg
            0035-enable-ACPI_CONFIGFS.cfg
            0036-enable-SND_SST_ATOM_HIFI2_PLATFORM.cfg
            0037-enable-SND_SOC_SOF-nocodec.cfg
            0038-enable-PHY_TUSB1210.cfg
            0039-enable-USB_CONFIGFS.cfg
            0040-enable-INTEL_MRFLD_ADC.cfg
            0041-enable-EXTCON_INTEL_MRFLD.cfg
            0042-disable-LOCALVERSION_AUTO.cfg
            ftdi_sio.cfg
            ch341.cfg
            smsc95xx.cfg
            bt_more.cfg
            i2c_chardev.cfg
            configfs.cfg
            bridge.cfg
            leds.cfg
            bpf.cfg
            btrfs.cfg
            sof_nocodec.cfg
            audio.cfg
            tun.cfg
            iio.cfg
            cdc_eem.cfg
            namespaces.cfg
            snd-usb-audio.cfg
            preempt.cfg
          )

          MERGE_ARGS=()
          for f in "${FRAGMENTS[@]}"; do
            if [ -f "${CFG_DIR}/${f}" ]; then
              MERGE_ARGS+=("${CFG_DIR}/${f}")
            else
              echo "WARN: fragment $f not found"
            fi
          done

          scripts/kconfig/merge_config.sh -m .config "${MERGE_ARGS[@]}"
          scripts/config --set-str CONFIG_LOCALVERSION "-edison-acpi-preempt-rt"
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          scripts/config --enable CONFIG_64BIT
          make olddefconfig

      - name: Verify config
        working-directory: linux-src
        run: |
          echo "=== KEY CONFIGS ==="
          grep -E "CONFIG_SND_USB|CONFIG_SND=|CONFIG_SOUND=|CONFIG_USB=" .config
          echo "=== KERNEL RELEASE ==="
          make kernelrelease

      - name: Build full kernel + modules
        working-directory: linux-src
        run: |
          # Build everything - kernel + all modules
          # This is the only reliable way to get working .ko files
          make -j$(nproc) 2>&1 | tail -20

      - name: Find and collect sound USB modules
        run: |
          KVER=$(cd linux-src && make kernelrelease)
          echo "Kernel release: $KVER"
          echo "KERNEL_RELEASE=$KVER" >> $GITHUB_ENV

          echo "=== ALL .ko IN sound/usb ==="
          find linux-src/sound/usb -name '*.ko' -o -name '*.ko.zst' || echo "NONE"

          echo "=== ALL .ko IN sound/ ==="
          find linux-src/sound -name '*.ko' -o -name '*.ko.zst' | head -30 || echo "NONE"

          mkdir -p output
          find linux-src/sound -name '*.ko' -exec cp -v {} output/ \;
          find linux-src/sound -name '*.ko.zst' -exec cp -v {} output/ \;

          # Decompress zstd
          for f in output/*.ko.zst; do
            [ -f "$f" ] && zstd -d "$f" -o "${f%.zst}" && rm "$f"
          done

          echo "=== OUTPUT FILES ==="
          ls -la output/

          # Create tarball
          tar czf snd-usb-audio-modules.tar.gz -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snd-usb-audio-modules
          path: output/
          retention-days: 90
          if-no-files-found: warn

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snd-usb-audio-${{ env.KERNEL_RELEASE || 'test' }}
          name: "snd-usb-audio for ${{ env.KERNEL_RELEASE || 'test' }}"
          files: |
            snd-usb-audio-modules.tar.gz
            output/*.ko
