name: Build snd-usb-audio module for Edison

on:
  push:
    branches: [snd-usb-audio]
    paths:
      - '.github/workflows/build-snd-usb-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout meta-intel-edison (our fork)
        uses: actions/checkout@v4

      - name: Checkout upstream meta-intel-edison for .cfg files
        uses: actions/checkout@v4
        with:
          repository: edison-fw/meta-intel-edison
          ref: master
          path: upstream-edison
          sparse-checkout: |
            meta-intel-edison-bsp/recipes-kernel/linux/files

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y flex bison libelf-dev libssl-dev

      - name: Clone Linux kernel source
        run: |
          git clone --depth 1 --branch v6.12.3 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            ~/linux-source

      - name: Patch kernel for Edison
        run: |
          cd ~/linux-source

          # 1. No-op setlocalversion to prevent git suffix
          printf '#!/bin/sh\n' > scripts/setlocalversion
          chmod +x scripts/setlocalversion

          # 2. Hardcode vermagic string to exactly match Edison kernel
          sed -i 's/#define VERMAGIC_STRING .*/#define VERMAGIC_STRING "6.12.3-edison-acpi-preempt-rt SMP preempt_rt mod_unload "/' include/linux/vermagic.h

          # 3. Force kernel.release to match Edison
          echo "6.12.3-edison-acpi-preempt-rt" > include/config/kernel.release

          echo "=== vermagic.h ==="
          grep VERMAGIC_STRING include/linux/vermagic.h
          echo "=== kernel.release ==="
          cat include/config/kernel.release

      - name: Prepare kernel config
        run: |
          cd ~/linux-source
          CFG_DIR="$GITHUB_WORKSPACE/upstream-edison/meta-intel-edison-bsp/recipes-kernel/linux/files"
          make defconfig
          MERGE_CFG=/tmp/edison-all.cfg
          cat /dev/null > $MERGE_CFG
          for cfg in \
            0001-enable-to-build-a-netboot-image.cfg \
            0002-enable-x2APIC.cfg \
            0003-enable-NETCONSOLE_DYNAMIC.cfg \
            0004-enable-STMMAC.cfg \
            0005-enable-IGB.cfg \
            0006-enable-IXGBE.cfg \
            0007-enable-USB_RTL8152.cfg \
            0008-disable-HPET.cfg \
            0009-disable-i915-DRM.cfg \
            0010-enable-X86_INTEL_MID.cfg \
            0011-enable-INPUT_SOC_BUTTON_ARRAY.cfg \
            0012-enable-I2C-HID-and-HID_MULTITOUCH.cfg \
            0013-DEBUG_SHIRQ-DEBUG_LOCKDEP.cfg \
            0014-enable-ACPI_DEBUG-and-ACPI_PROCFS_POWER.cfg \
            0015-enable-ACPI_TABLE_UPGRADE.cfg \
            0016-enable-X86_INTEL_LPSS-and-LPSS-drivers.cfg \
            0017-enable-MFD_INTEL_LPSS-drivers.cfg \
            0018-enable-INTEL_IDMA64-iDMA-64-bit.cfg \
            0020-enable-SPI_DW.cfg \
            0021-disable-HDA-audio.cfg \
            0022-enable-Intel-Quark-devices.cfg \
            0023-enable-DEBUG_GPIO.cfg \
            0024-enable-GPIO_DWAPB.cfg \
            0025-enable-GPIO_PCA953X.cfg \
            0029-enable-INTEL_IDLE.cfg \
            0030-enable-PUNIT_ATOM_DEBUG.cfg \
            0031-enable-REGULATOR.cfg \
            0032-enable-BRCMFMAC.cfg \
            0033-enable-BT_HCIUART_BCM.cfg \
            0034-enable-ADS7950.cfg \
            0035-enable-ACPI_CONFIGFS.cfg \
            0036-enable-SND_SST_ATOM_HIFI2_PLATFORM.cfg \
            0037-enable-SND_SOC_SOF-nocodec.cfg \
            0038-enable-PHY_TUSB1210.cfg \
            0039-enable-USB_CONFIGFS.cfg \
            0040-enable-INTEL_MRFLD_ADC.cfg \
            0041-enable-EXTCON_INTEL_MRFLD.cfg \
            0042-disable-LOCALVERSION_AUTO.cfg \
            preempt.cfg \
            ftdi_sio.cfg ch341.cfg smsc95xx.cfg bt_more.cfg \
            i2c_chardev.cfg configfs.cfg bridge.cfg leds.cfg bpf.cfg \
            btrfs.cfg sof_nocodec.cfg audio.cfg tun.cfg iio.cfg \
            cdc_eem.cfg namespaces.cfg; do
            if [ -f "$CFG_DIR/$cfg" ]; then
              cat "$CFG_DIR/$cfg" >> $MERGE_CFG
              echo "" >> $MERGE_CFG
            else
              echo "WARNING: $cfg not found"
            fi
          done
          scripts/kconfig/merge_config.sh -m .config $MERGE_CFG 2>&1 | tail -30
          scripts/config --enable  CONFIG_SND_USB
          scripts/config --module  CONFIG_SND_USB_AUDIO
          scripts/config --module  CONFIG_SND_HWDEP
          scripts/config --module  CONFIG_SND_RAWMIDI
          scripts/config --unset   CONFIG_LOCALVERSION
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          yes '' | make oldconfig 2>&1 | tail -10
          echo "=== Final SND_USB_AUDIO ==="
          grep CONFIG_SND_USB_AUDIO .config
          echo "=== LOCALVERSION ==="
          grep CONFIG_LOCALVERSION .config || echo "(unset)"

      - name: Build modules
        run: |
          cd ~/linux-source
          make -j$(nproc) modules 2>&1 | tail -20

      - name: Verify and collect modules
        run: |
          cd ~/linux-source
          KOS=$(find . -name '*.ko' | grep -E 'snd-usb-audio|snd-usbmidi-lib|snd-hwdep|snd-rawmidi')
          if [ -z "$KOS" ]; then
            echo "FATAL: No .ko files found"
            exit 1
          fi
          echo "=== Module vermagic ==="
          for ko in $KOS; do
            modinfo "$ko" 2>/dev/null | grep vermagic
          done
          echo "=== Module depends ==="
          for ko in $KOS; do
            modinfo "$ko" 2>/dev/null | grep depends
          done

      - name: Package and upload
        run: |
          mkdir -p output/modules
          cd ~/linux-source
          find . -name '*.ko' | grep -E 'snd-usb-audio|snd-usbmidi-lib|snd-hwdep|snd-rawmidi' | while read ko; do
            cp -v "$ko" $GITHUB_WORKSPACE/output/modules/
          done
          cat > output/install_on_edison.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          KVER="6.12.3-edison-acpi-preempt-rt"
          MODDIR="/lib/modules/$KVER/extra"
          mkdir -p "$MODDIR"
          cp -v "$(dirname $0)/modules/"*.ko "$MODDIR/"
          depmod -a "$KVER"
          modprobe snd-hwdep && modprobe snd-rawmidi && modprobe snd-usb-audio
          echo "Done. Check: aplay -l"
          SCRIPT
          chmod +x output/install_on_edison.sh
          ls -la output/modules/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snd-usb-audio-modules-v6.12.3
          path: output/
          retention-days: 90
