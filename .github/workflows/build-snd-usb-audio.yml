name: Build snd-usb-audio for Edison

on:
  push:
    branches:
      - snd-usb-audio
    paths:
      - '.github/workflows/build-snd-usb-audio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check pre-installed tools
        run: |
          echo "=== System Information ==="
          uname -a
          echo "=== Pre-installed compilers ==="
          which gcc g++ make || echo "gcc not found"
          gcc --version | head -1
          echo "=== Python ==="
          which python3

      - name: Download kernel source via curl/wget
        run: |
          cd /tmp
          echo "Downloading Linux kernel v6.12.3..."
          which curl >/dev/null && curl -L -O https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.3.tar.xz || \
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.3.tar.xz
          tar -xf linux-6.12.3.tar.xz
          cd linux-6.12.3
          ls -la | head -10

      - name: Configure kernel for Edison
        run: |
          cd /tmp/linux-6.12.3
          
          # Set up base configuration
          make defconfig
          
          # Append audio configurations
          cat >> .config << 'END_CONFIG'
CONFIG_SND=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_HWDEP=m
CONFIG_SND_RAWMIDI=m
CONFIG_LOCALVERSION="-edison-acpi-preempt-rt"
# CONFIG_LOCALVERSION_AUTO is not set
END_CONFIG
          
          # Make oldconfig without prompting
          yes | make oldconfig || true
          
          # Verify key configurations
          echo "=== Kernel Configuration ==="
          grep -E "^CONFIG_SND_USB|^CONFIG_LOCALVERSION" .config | sort

      - name: Build kernel
        run: |
          cd /tmp/linux-6.12.3
          echo "Starting build..."
          ncpus=$(($(nproc) - 1))
          echo "Using $ncpus CPU cores"
          timeout 120m make -j$ncpus 2>&1 | head -100
          echo "..."
          timeout 120m make -j$ncpus 2>&1 | tail -50

      - name: List compiled modules
        run: |
          cd /tmp/linux-6.12.3
          echo "=== Searching for audio modules ==="
          find . -name "snd-usb-audio.ko" 2>/dev/null | head -5
          find . -name "snd-hwdep.ko" 2>/dev/null | head -5
          find . -name "snd-rawmidi.ko" 2>/dev/null | head -5
          find . -name "snd-usbmidi-lib.ko" 2>/dev/null | head -5

      - name: Copy modules
        run: |
          mkdir -p /tmp/artifacts
          cd /tmp/linux-6.12.3
          
          echo "=== Copying modules ==="
          find . -name "snd-usb-audio.ko" -o \
                 -name "snd-hwdep.ko" -o \
                 -name "snd-rawmidi.ko" -o \
                 -name "snd-usbmidi-lib.ko" | \
            while read f; do
              echo "Copying: $f"
              cp "$f" /tmp/artifacts/
            done
          
          ls -lah /tmp/artifacts/

      - name: Create artifact bundle
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          cp /tmp/artifacts/*.ko $GITHUB_WORKSPACE/output/ 2>/dev/null || echo "No .ko files found"
          
          cat > $GITHUB_WORKSPACE/output/README.txt << 'README_END'
Edison snd-usb-audio Modules - Linux v6.12.3
==============================================
Kernel: 6.12.3-edison-acpi-preempt-rt

To install:
1. Copy *.ko files to /lib/modules/6.12.3-edison-acpi-preempt-rt/extra/
2. Run: depmod -a 6.12.3-edison-acpi-preempt-rt
3. Load modules: modprobe snd-usb-audio

Included modules:
- snd-usb-audio.ko (main USB audio support)
- snd-hwdep.ko, snd-rawmidi.ko (dependencies)
README_END
          
          ls -lah $GITHUB_WORKSPACE/output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snd-usb-audio-edison-6.12.3
          path: output/
