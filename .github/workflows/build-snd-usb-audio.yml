name: Build snd-usb-audio for Edison (v4)

on:
  push:
    branches:
      - snd-usb-audio
    paths:
      - '.github/workflows/build-snd-usb-audio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install core build dependencies only
        run: |
          echo "Installing minimal dependencies..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison libelf-dev libssl-dev bc || true
          which gcc make
          gcc --version | head -1

      - name: Get kernel source via direct wget
        run: |
          cd /tmp
          echo "Downloading kernel..."
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.3.tar.xz 2>&1 | tail -5
          echo "Extracting..."
          tar -xf linux-6.12.3.tar.xz
          ls -d linux-* | head -5

      - name: Configure kernel
        run: |
          cd /tmp/linux-6.12.3
          make defconfig
          
          # Configure for USB audio
          sed -i '/^CONFIG_/d' .config
          cat >> .config << 'EOF'
CONFIG_SND=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_HWDEP=m
CONFIG_SND_RAWMIDI=m
CONFIG_LOCALVERSION="-edison-acpi-preempt-rt"
EOF
          
          make oldconfig < /dev/null
          grep CONFIG_SND_USB_AUDIO .config

      - name: Build
        run: |
          cd /tmp/linux-6.12.3
          make -j$(nproc) 2>&1 | grep -E "error|warning:|vmlinux$" | tail -20 || true

      - name: Find modules
        run: |
          cd /tmp/linux-6.12.3
          find . -name "snd-usb-audio.ko" | head -1 || find . -name "*.ko" | head -10

      - name: Collect modules
        run: |
          mkdir -p output
          cd /tmp/linux-6.12.3
          for ko in snd-usb-audio.ko snd-hwdep.ko snd-rawmidi.ko snd-usbmidi-lib.ko; do
            find . -name "$ko" -exec cp {} output/ \; 2>/dev/null || true
          done
          ls -lah output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snd-usb-audio-edison-6.12.3
          path: output/
