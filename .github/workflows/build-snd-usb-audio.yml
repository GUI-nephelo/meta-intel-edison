name: Build snd-usb-audio for Edison

on:
  push:
    branches:
      - snd-usb-audio
    paths:
      - '.github/workflows/build-snd-usb-audio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gcc:latest
      options: --user root

    steps:
      - name: Install git and download tools
        run: |
          apt-get update && apt-get install -y git curl xz-utils bc flex bison libelf-dev libssl-dev

      - uses: actions/checkout@v4

      - name: Download Linux kernel
        run: |
          cd /tmp
          curl -L -o linux-6.12.3.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.3.tar.xz
          tar -xf linux-6.12.3.tar.xz
          cd linux-6.12.3
          echo "Kernel ready: $(pwd)"

      - name: Configure kernel
        run: |
          cd /tmp/linux-6.12.3
          make defconfig
          
          cat >> .config << 'EOF'
CONFIG_SND=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_HWDEP=m
CONFIG_SND_RAWMIDI=m
CONFIG_LOCALVERSION="-edison-acpi-preempt-rt"
# CONFIG_LOCALVERSION_AUTO is not set
EOF
          
          yes | make oldconfig

      - name: Build kernel
        run: |
          cd /tmp/linux-6.12.3
          make -j2 2>&1 | tail -100

      - name: Collect modules
        run: |
          mkdir -p /tmp/out
          cd /tmp/linux-6.12.3
          find . -name "snd-usb-audio.ko" -o -name "snd-hwdep.ko" -o -name "snd-rawmidi.ko" -o -name "snd-usbmidi-lib.ko" | \
            xargs -I {} cp {} /tmp/out/
          ls -lah /tmp/out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snd-usb-audio-edison
          path: /tmp/out/
