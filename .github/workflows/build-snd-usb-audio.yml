name: Build snd-usb-audio for Edison

on:
  push:
    branches:
      - snd-usb-audio
    paths:
      - '.github/workflows/build-snd-usb-audio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download kernel
        shell: bash
        run: |
          cd /tmp
          curl -L https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.3.tar.xz | tar -xJ
          cd linux-6.12.3
          echo "=== Kernel structure ==="
          ls -d ./* | head -10

      - name: Configure for Edison
        shell: bash
        run: |
          cd /tmp/linux-6.12.3
          
          # Basic config
          make defconfig >/dev/null 2>&1
          
          # Audio setup
          echo 'CONFIG_SND=y' >> .config
          echo 'CONFIG_SND_USB=y' >> .config
          echo 'CONFIG_SND_USB_AUDIO=m' >> .config
          echo 'CONFIG_SND_HWDEP=m' >> .config
          echo 'CONFIG_SND_RAWMIDI=m' >> .config
          echo 'CONFIG_LOCALVERSION="-edison-acpi-preempt-rt"' >> .config
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> .config
          
          # Apply config
          yes | make oldconfig >/dev/null 2>&1 || true
          
          # Verify
          echo "Config check:"
          grep "CONFIG_SND_USB_AUDIO\|CONFIG_LOCALVERSION" .config

      - name: Build kernel
        shell: bash
        run: |
          cd /tmp/linux-6.12.3
          # Use minimal CPU to avoid timeout
          make -j2 2>&1 | tail -100

      - name: Package modules
        shell: bash
        run: |
          mkdir -p output
          cd /tmp/linux-6.12.3
          
          # Find and copy
          find . -name 'snd-usb-audio.ko' -exec cp {} output/ \;
          find . -name 'snd-hwdep.ko' -exec cp {} output/ \;
          find . -name 'snd-rawmidi.ko' -exec cp {} output/ \;
          find . -name 'snd-usbmidi-lib.ko' -exec cp {} output/ \;
          
          echo "Output:"
          ls -lah output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snd-usb-audio-edison
          path: output/
