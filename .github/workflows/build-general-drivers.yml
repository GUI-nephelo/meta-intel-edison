name: Build General Drivers for Intel Edison

on:
  push:
    branches: [general_driver]
    paths:
      - '.github/workflows/build-general-drivers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout meta-intel-edison (our fork)
        uses: actions/checkout@v4

      - name: Checkout upstream meta-intel-edison for .cfg files
        uses: actions/checkout@v4
        with:
          repository: edison-fw/meta-intel-edison
          ref: master
          path: upstream-edison
          sparse-checkout: |
            meta-intel-edison-bsp/recipes-kernel/linux/files

      - name: Cache linux source
        uses: actions/cache@v4
        id: cache-linux
        with:
          path: ~/linux-source
          key: linux-v6.12.3-general-drivers-v3

      - name: Clone Linux kernel source
        if: steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/linux-source
          git clone --depth 1 --branch v6.12.3 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            ~/linux-source

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y flex bison libelf-dev libssl-dev

      - name: Prepare kernel config (matching Edison exactly)
        run: |
          cd ~/linux-source
          CFG_DIR="$GITHUB_WORKSPACE/upstream-edison/meta-intel-edison-bsp/recipes-kernel/linux/files"

          echo "=== .cfg files count ==="
          ls "$CFG_DIR"/*.cfg 2>/dev/null | wc -l

          make defconfig

          # Concatenate all .cfg fragments into one file, then merge
          MERGE_CFG=/tmp/edison-all.cfg
          cat /dev/null > $MERGE_CFG

          for cfg in \
            0001-enable-to-build-a-netboot-image.cfg \
            0002-enable-x2APIC.cfg \
            0003-enable-NETCONSOLE_DYNAMIC.cfg \
            0004-enable-STMMAC.cfg \
            0005-enable-IGB.cfg \
            0006-enable-IXGBE.cfg \
            0007-enable-USB_RTL8152.cfg \
            0008-disable-HPET.cfg \
            0009-disable-i915-DRM.cfg \
            0010-enable-X86_INTEL_MID.cfg \
            0011-enable-INPUT_SOC_BUTTON_ARRAY.cfg \
            0012-enable-I2C_HID-and-HID_MULTITOUCH.cfg \
            0013-DEBUG_SHIRQ-DEBUG_LOCKDEP.cfg \
            0014-enable-ACPI_DEBUG-and-ACPI_PROCFS_POWER.cfg \
            0015-enable-ACPI_TABLE_UPGRADE.cfg \
            0016-enable-X86_INTEL_LPSS-and-LPSS-drivers.cfg \
            0017-enable-MFD_INTEL_LPSS-drivers.cfg \
            0018-enable-INTEL_IDMA64-iDMA-64-bit.cfg \
            0020-enable-SPI_DW.cfg \
            0021-disable-HDA-audio.cfg \
            0022-enable-Intel-Quark-devices.cfg \
            0023-enable-DEBUG_GPIO.cfg \
            0024-enable-GPIO_DWAPB.cfg \
            0025-enable-GPIO_PCA953X.cfg \
            0029-enable-INTEL_IDLE.cfg \
            0030-enable-PUNIT_ATOM_DEBUG.cfg \
            0031-enable-REGULATOR.cfg \
            0032-enable-BRCMFMAC.cfg \
            0033-enable-BT_HCIUART_BCM.cfg \
            0034-enable-ADS7950.cfg \
            0035-enable-ACPI_CONFIGFS.cfg \
            0036-enable-SND_SST_ATOM_HIFI2_PLATFORM.cfg \
            0037-enable-SND_SOC_SOF-nocodec.cfg \
            0038-enable-PHY_TUSB1210.cfg \
            0039-enable-USB_CONFIGFS.cfg \
            0040-enable-INTEL_MRFLD_ADC.cfg \
            0041-enable-EXTCON_INTEL_MRFLD.cfg \
            0042-disable-LOCALVERSION_AUTO.cfg \
            preempt.cfg \
            ftdi_sio.cfg ch341.cfg smsc95xx.cfg bt_more.cfg \
            i2c_chardev.cfg configfs.cfg bridge.cfg leds.cfg bpf.cfg \
            btrfs.cfg sof_nocodec.cfg audio.cfg tun.cfg iio.cfg \
            cdc_eem.cfg namespaces.cfg; do
            if [ -f "$CFG_DIR/$cfg" ]; then
              cat "$CFG_DIR/$cfg" >> $MERGE_CFG
              echo "" >> $MERGE_CFG
            else
              echo "WARNING: $cfg not found"
            fi
          done

          echo "=== Merged config fragment lines ==="
          wc -l $MERGE_CFG

          # Merge all fragments at once
          scripts/kconfig/merge_config.sh -m .config $MERGE_CFG 2>&1 | tail -30

          # ========================================
          # Enable target driver modules
          # ========================================

          # --- WireGuard ---
          scripts/config --module CONFIG_WIREGUARD
          # WireGuard crypto dependencies (must be =m so .ko files are produced)
          scripts/config --module CONFIG_CRYPTO_LIB_CHACHA20POLY1305
          scripts/config --module CONFIG_CRYPTO_LIB_CURVE25519
          scripts/config --module CONFIG_CRYPTO_CURVE25519_X86
          # UDP tunnel dependencies
          scripts/config --module CONFIG_UDP_TUNNEL
          scripts/config --module CONFIG_INET_UDP_TUNNEL

          # --- 802.1Q VLAN ---
          scripts/config --module CONFIG_VLAN_8021Q

          # Ensure vermagic matches exactly
          scripts/config --set-str CONFIG_LOCALVERSION "-edison-acpi-preempt-rt"
          scripts/config --disable CONFIG_LOCALVERSION_AUTO

          yes '' | make oldconfig 2>&1 | tail -10

          echo "=== Key configs verification ==="
          grep -E 'CONFIG_WIREGUARD=|CONFIG_VLAN_8021Q=|CONFIG_CRYPTO_LIB_CHACHA20POLY1305=|CONFIG_CRYPTO_LIB_CURVE25519=|CONFIG_CRYPTO_CURVE25519_X86=|CONFIG_UDP_TUNNEL=|CONFIG_INET_UDP_TUNNEL=|CONFIG_PREEMPT_RT=|CONFIG_LOCALVERSION=' .config

          # Verify critical modules
          FAILED=0
          for opt in CONFIG_WIREGUARD CONFIG_VLAN_8021Q \
                     CONFIG_CRYPTO_LIB_CHACHA20POLY1305 CONFIG_CRYPTO_LIB_CURVE25519 \
                     CONFIG_UDP_TUNNEL CONFIG_INET_UDP_TUNNEL; do
            if ! grep -q "${opt}=m" .config; then
              echo "FATAL: ${opt} not set as module!"
              grep -E "${opt}" .config || echo "  (not found at all)"
              FAILED=1
            fi
          done
          [ $FAILED -eq 1 ] && exit 1

      - name: Build full kernel + modules
        run: |
          cd ~/linux-source
          make -j$(nproc) 2>&1 | tail -10

      - name: Patch 8021q Makefile and build out-of-tree modules
        run: |
          cd ~/linux-source
          set -o pipefail

          # === Fix 8021q Makefile ===
          # vlan_core.c has its own module_init (vlan_offload_init) which conflicts
          # with vlan.c's module_init when linked into same composite module.
          # Fix: make vlan_core a SEPARATE module (obj-m) instead of builtin (obj-y).
          # The $(subst m,y,...) trick forces obj-y; we replace it with obj-m.
          echo "=== Patching net/8021q/Makefile ==="
          sed -i 's/^obj-\$(subst m,y,\$(CONFIG_VLAN_8021Q)).*vlan_core\.o/obj-m += vlan_core.o/' net/8021q/Makefile
          echo "--- Patched Makefile ---"
          cat net/8021q/Makefile

          # WireGuard
          echo "=== Building WireGuard ==="
          make M=drivers/net/wireguard 2>&1 | tail -5
          echo "=== WireGuard build exit: $? ==="

          # 802.1Q VLAN (now produces vlan_core.ko + 8021q.ko)
          echo "=== Building 802.1Q VLAN ==="
          make M=net/8021q 2>&1 | tail -5
          echo "=== 8021q build exit: $? ==="

          # Verify 8021q build produced both modules
          echo "=== Verify vlan_core.ko ==="
          ls -la net/8021q/vlan_core.ko || echo "MISSING vlan_core.ko!"
          echo "=== Verify 8021q.ko ==="
          ls -la net/8021q/8021q.ko || echo "MISSING 8021q.ko!"

      - name: Verify and collect modules
        run: |
          cd ~/linux-source

          mkdir -p output/modules/wireguard
          mkdir -p output/modules/vlan

          # WireGuard dependencies (from full kernel build)
          echo "=== Collecting WireGuard dependencies ==="
          for mod in libchacha20poly1305 udp_tunnel ip6_udp_tunnel curve25519-x86_64 libcurve25519-generic; do
            ko=$(find . -name "${mod}.ko" -not -path "./output/*" | head -1)
            if [ -n "$ko" ]; then
              echo "  Found: $ko"
              cp -v "$ko" output/modules/wireguard/
            else
              echo "  MISSING: ${mod}.ko"
            fi
          done

          # WireGuard itself
          echo "=== WireGuard module ==="
          find drivers/net/wireguard -name '*.ko' -exec cp -v {} output/modules/wireguard/ \;
          ls output/modules/wireguard/

          # 802.1Q (vlan_core.ko + 8021q.ko)
          echo "=== VLAN modules ==="
          find net/8021q -name '*.ko' -exec cp -v {} output/modules/vlan/ \;
          ls output/modules/vlan/

          # Overall verification
          echo ""
          echo "=========================================="
          echo "  MODULE VERIFICATION SUMMARY"
          echo "=========================================="
          TOTAL=0
          for ko in $(find output/modules -name '*.ko'); do
            TOTAL=$((TOTAL + 1))
            VER=$(modinfo "$ko" 2>/dev/null | grep vermagic || echo "NO VERMAGIC")
            MOD_SIZE=$(readelf -SW "$ko" 2>/dev/null | grep '.gnu.linkonce.this_module' | awk '{print $6}')
            echo "  [$TOTAL] $(basename $ko): vermagic=$(echo $VER | awk '{print $NF}') this_module=0x$MOD_SIZE"
            if [ "0x$MOD_SIZE" != "0x4c0" ] && [ -n "$MOD_SIZE" ]; then
              echo "  WARNING: struct module size mismatch (expected 0x4c0)"
            fi
          done
          echo ""
          echo "Total modules: $TOTAL"
          echo "=========================================="

      - name: Create install script
        run: |
          cd ~/linux-source
          cat > output/install_on_edison.sh << 'EOF'
          #!/bin/bash 
          set -e
          KVER="6.12.3-edison-acpi-preempt-rt"
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          MODDIR="/lib/modules/$KVER/extra"
          
          mkdir -p "$MODDIR"
          
          echo "=== Installing WireGuard + dependencies ==="
          cp -v "$SCRIPT_DIR/modules/wireguard/"*.ko "$MODDIR/" 2>/dev/null || echo "No WireGuard modules"
          
          echo "=== Installing VLAN ==="
          cp -v "$SCRIPT_DIR/modules/vlan/"*.ko "$MODDIR/" 2>/dev/null || echo "No VLAN modules"
          
          depmod -a "$KVER"
          
          echo ""
          echo "=== Loading test ==="
          
          # WireGuard dependencies first
          for mod in libchacha20poly1305 libcurve25519-generic curve25519-x86_64 udp_tunnel ip6_udp_tunnel; do
            modprobe "$mod" 2>/dev/null && echo "  $mod: OK" || echo "  $mod: FAIL (may be builtin)"
          done
          
          # WireGuard
          modprobe wireguard 2>/dev/null && echo "  wireguard: OK" || echo "  wireguard: FAIL"
          
          # VLAN (vlan_core must load first, modprobe handles dependency)
          modprobe vlan_core 2>/dev/null && echo "  vlan_core: OK" || echo "  vlan_core: FAIL"
          modprobe 8021q 2>/dev/null && echo "  8021q: OK" || echo "  8021q: FAIL"
          
          echo ""
          echo "=== All modules installed ==="
          EOF
          chmod +x output/install_on_edison.sh

      - name: Upload general drivers
        uses: actions/upload-artifact@v4
        with:
          name: general-drivers-v6.12.3
          path: /home/runner/linux-source/output/
          retention-days: 30
