name: Build snd-usb-audio for Edison v6.12.3 (simplified)

on:
  push:
    branches:
      - snd-usb-audio-simple
    paths:
      - '.github/workflows/build-snd-usb-audio-simple.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential flex bison libelf-dev libssl-dev bc \
            libncurses-dev libncurses5 libncursesw5

      - name: Get kernel source
        run: |
          cd ~
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.3.tar.xz
          tar -xf linux-6.12.3.tar.xz
          cd linux-6.12.3
          echo "=== Kernel version ==="
          grep "^VERSION\|^PATCHLEVEL\|^SUBLEVEL" Makefile

      - name: Configure kernel
        run: |
          cd ~/linux-6.12.3
          # Use defconfig as baseline
          make defconfig
          
          # Enable audio modules
          echo "CONFIG_SND=y" >> .config
          echo "CONFIG_SND_USB=y" >> .config
          echo "CONFIG_SND_USB_AUDIO=m" >> .config
          echo "CONFIG_SND_HWDEP=m" >> .config
          echo "CONFIG_SND_RAWMIDI=m" >> .config
          
          # LOCALVERSION setup for Edison
          echo "CONFIG_LOCALVERSION=\"-edison-acpi-preempt-rt\"" >> .config
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> .config
          
          # Finalize config
          make oldconfig < /dev/null
          
          echo "=== Config verification ==="
          grep "CONFIG_SND_USB_AUDIO\|CONFIG_LOCALVERSION" .config

      - name: Build kernel
        run: |
          cd ~/linux-6.12.3
          make -j$(nproc) 2>&1 | grep -E "(error|warning:|vmlinux)" | tail -20

      - name: Find modules
        run: |
          cd ~/linux-6.12.3
          echo "=== Looking for modules ==="
          find . -name "snd-usb-audio.ko" -o \
                 -name "snd-hwdep.ko" -o \
                 -name "snd-rawmidi.ko" -o \
                 -name "snd-usbmidi-lib.ko" | tee /tmp/found_modules.txt
          
          if [ ! -s /tmp/found_modules.txt ]; then
            echo "ERROR: No modules found!"
            find . -path ./tools -prune -o -name "*.ko" -type f -print | head -20
            exit 1
          fi

      - name: Copy and verify modules
        run: |
          mkdir -p ${{ github.workspace }}/output
          cd ~/linux-6.12.3
          
          find . -name "snd-usb-audio.ko" -o \
                 -name "snd-hwdep.ko" -o \
                 -name "snd-rawmidi.ko" -o \
                 -name "snd-usbmidi-lib.ko" | while read ko; do
            cp "$ko" ${{ github.workspace }}/output/
            echo "Copied: $(basename $ko)"
          done
          
          ls -lah ${{ github.workspace }}/output/

      - name: Verify vermagic
        run: |
          cd ${{ github.workspace }}/output
          echo "=== Module Information ==="
          for ko in *.ko; do
            if [ -f "$ko" ]; then
              echo ""
              echo "File: $ko"
              modinfo "$ko" 2>/dev/null | grep -E "^(vermagic|depends|filename):" || \
              file "$ko"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snd-usb-audio-edison-v6.12.3
          path: output/
          retention-days: 90
