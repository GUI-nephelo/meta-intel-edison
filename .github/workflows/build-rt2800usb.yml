name: Build rt2800usb module for Edison

on:
  push:
    branches: [build/rt2800usb]
    paths:
      - '.github/workflows/build-rt2800usb.yml'
      - 'meta-intel-edison-bsp/recipes-kernel/linux/files/**'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version tag'
        required: false
        default: 'v6.12.3'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout meta-intel-edison
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          KERNEL_VERSION="${{ github.event.inputs.kernel_version || 'v6.12.3' }}"
          echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "Building for kernel: $KERNEL_VERSION"

      - name: Cache linux source
        uses: actions/cache@v4
        id: cache-linux
        with:
          path: ~/linux-source
          key: linux-${{ steps.vars.outputs.kernel_version }}-v2

      - name: Clone Linux kernel source
        if: steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ steps.vars.outputs.kernel_version }} \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            ~/linux-source

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y flex bison libelf-dev libssl-dev

      - name: Prepare kernel config
        run: |
          cd ~/linux-source
          # Start with allnoconfig then enable what we need
          make allnoconfig
          # Enable essential x86_64 options
          scripts/config --enable CONFIG_64BIT
          scripts/config --enable CONFIG_SMP
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_MODULE_UNLOAD
          scripts/config --enable CONFIG_PREEMPT_RT
          scripts/config --enable CONFIG_USB
          scripts/config --enable CONFIG_USB_SUPPORT
          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_INET
          scripts/config --enable CONFIG_WIRELESS
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          # Enable rt2800usb driver chain
          scripts/config --module CONFIG_RT2X00
          scripts/config --module CONFIG_RT2X00_LIB
          scripts/config --enable CONFIG_RT2X00_LIB_CRYPTO
          scripts/config --module CONFIG_RT2X00_USB
          scripts/config --module CONFIG_RT2800_LIB
          scripts/config --enable CONFIG_RT2800_LIB_MMIO
          scripts/config --module CONFIG_RT2800USB
          scripts/config --enable CONFIG_RT2800USB_RT33XX
          scripts/config --enable CONFIG_RT2800USB_RT35XX
          scripts/config --enable CONFIG_RT2800USB_RT3573
          scripts/config --enable CONFIG_RT2800USB_RT53XX
          scripts/config --enable CONFIG_RT2800USB_RT55XX
          scripts/config --enable CONFIG_RT2800USB_UNKNOWN
          # Set local version to match Edison
          scripts/config --set-str CONFIG_LOCALVERSION "-edison-acpi-preempt-rt"
          # Resolve all dependencies
          make olddefconfig
          echo "=== Verifying config ==="
          grep -E 'CONFIG_(RT2800USB|RT2X00|CFG80211|MAC80211|USB|MODULES)=' .config

      - name: Build kernel and modules
        run: |
          cd ~/linux-source
          # Build the full kernel first (needed for modules)
          make -j$(nproc) 2>&1 | tail -20
          echo "=== Kernel built ==="
          ls -la arch/x86/boot/bzImage

      - name: Build rt2800usb modules
        run: |
          cd ~/linux-source
          make M=drivers/net/wireless/ralink/rt2x00 modules -j$(nproc) 2>&1
          echo "=== Module files ==="
          find drivers/net/wireless/ralink -name '*.ko' -ls
          find drivers/net/wireless/ralink -name 'rt2800usb.ko' -exec modinfo {} \;

      - name: Package modules
        run: |
          mkdir -p output/modules
          cd ~/linux-source
          find drivers/net/wireless/ralink -name '*.ko' -exec cp {} $GITHUB_WORKSPACE/output/modules/ \;
          ls -la $GITHUB_WORKSPACE/output/modules/

      - name: Create install script
        run: |
          OUTDIR="$GITHUB_WORKSPACE/output"
          printf '#!/bin/bash\n' > "$OUTDIR/install_on_edison.sh"
          printf '# Install rt2800usb modules on Intel Edison\n' >> "$OUTDIR/install_on_edison.sh"
          printf '# Usage: scp modules/* and this script to Edison, then: bash install_on_edison.sh\n\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'KVER="6.12.3-edison-acpi-preempt-rt"\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'MODDIR="/lib/modules/$KVER/extra"\n\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'echo "Creating module directory..."\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'mkdir -p "$MODDIR"\n\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'echo "Copying modules..."\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'cp -v "$SCRIPT_DIR/modules/"*.ko "$MODDIR/"\n\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'echo "Updating module dependencies..."\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'depmod -a "$KVER"\n\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'echo "Loading modules..."\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'modprobe rt2800usb\n\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'echo "Verifying..."\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'lsmod | grep rt2x00\n' >> "$OUTDIR/install_on_edison.sh"
          printf 'ip link show wlan1 2>/dev/null && echo "SUCCESS: wlan1 interface created!" || echo "Check dmesg for errors"\n' >> "$OUTDIR/install_on_edison.sh"
          chmod +x "$OUTDIR/install_on_edison.sh"

      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt2800usb-modules-${{ steps.vars.outputs.kernel_version }}
          path: output/
          retention-days: 30
