name: Build rt2800usb module for Edison

on:
  push:
    branches: [build/rt2800usb]
    paths:
      - '.github/workflows/build-rt2800usb.yml'
      - 'meta-intel-edison-bsp/recipes-kernel/linux/files/**'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version tag'
        required: false
        default: 'v6.12.3'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout meta-intel-edison
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          KERNEL_VERSION="${{ github.event.inputs.kernel_version || 'v6.12.3' }}"
          echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "Building for kernel: $KERNEL_VERSION"

      - name: Cache linux source
        uses: actions/cache@v4
        id: cache-linux
        with:
          path: ~/linux-source
          key: linux-${{ steps.vars.outputs.kernel_version }}-defconfig-v1

      - name: Clone Linux kernel source
        if: steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/linux-source
          git clone --depth 1 --branch ${{ steps.vars.outputs.kernel_version }} \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            ~/linux-source

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y flex bison libelf-dev libssl-dev

      - name: Prepare kernel config
        run: |
          cd ~/linux-source
          # Use defconfig as base - has full x86_64 driver framework
          make defconfig
          # Enable rt2800usb driver and its dependencies
          scripts/config --module CONFIG_RT2X00
          scripts/config --module CONFIG_RT2X00_LIB
          scripts/config --enable CONFIG_RT2X00_LIB_CRYPTO
          scripts/config --module CONFIG_RT2X00_USB
          scripts/config --module CONFIG_RT2800_LIB
          scripts/config --module CONFIG_RT2800USB
          scripts/config --enable CONFIG_RT2800USB_RT33XX
          scripts/config --enable CONFIG_RT2800USB_RT35XX
          scripts/config --enable CONFIG_RT2800USB_RT3573
          scripts/config --enable CONFIG_RT2800USB_RT53XX
          scripts/config --enable CONFIG_RT2800USB_RT55XX
          scripts/config --enable CONFIG_RT2800USB_UNKNOWN
          # Set local version to match Edison kernel
          scripts/config --set-str CONFIG_LOCALVERSION "-edison-acpi-preempt-rt"
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          # Resolve all dependencies
          make olddefconfig
          echo "=== Verifying rt2800usb config ==="
          grep -E 'CONFIG_RT(2x00|2800)' .config || echo "ERROR: RT config not found!"

      - name: Build kernel
        run: |
          cd ~/linux-source
          make -j$(nproc) 2>&1 | tail -5
          echo "=== Kernel image ==="
          ls -la arch/x86/boot/bzImage

      - name: Build rt2800usb modules
        run: |
          cd ~/linux-source
          echo "Building rt2x00 subsystem..."
          make M=drivers/net/wireless/ralink/rt2x00/ modules -j$(nproc)
          echo "=== Searching for .ko files ==="
          find drivers/net/wireless/ralink -name '*.ko' -ls || echo "NO .ko FILES FOUND"
          echo "=== Module info ==="
          find drivers/net/wireless/ralink -name '*.ko' -exec modinfo {} \;

      - name: Package modules
        run: |
          mkdir -p output/modules
          cd ~/linux-source
          KOS=$(find drivers/net/wireless/ralink -name '*.ko')
          if [ -z "$KOS" ]; then
            echo "FATAL: No .ko files found! Build must have failed silently."
            exit 1
          fi
          echo "Copying modules:"
          for ko in $KOS; do
            echo "  $ko"
            cp "$ko" $GITHUB_WORKSPACE/output/modules/
          done
          echo "=== Package contents ==="
          ls -la $GITHUB_WORKSPACE/output/modules/

      - name: Create install script
        run: |
          OUTDIR="$GITHUB_WORKSPACE/output"
          cat > "$OUTDIR/install_on_edison.sh" << 'INSTALLSCRIPT'
          #!/bin/bash
          # Install rt2800usb modules on Intel Edison
          # scp modules/* and this script to Edison, then: bash install_on_edison.sh
          set -e
          KVER="6.12.3-edison-acpi-preempt-rt"
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          MODDIR="/lib/modules/$KVER/extra"
          echo "Creating module directory: $MODDIR"
          mkdir -p "$MODDIR"
          echo "Copying modules..."
          cp -v "$SCRIPT_DIR/modules/"*.ko "$MODDIR/"
          echo "Updating module dependencies..."
          depmod -a "$KVER"
          echo "Loading modules..."
          modprobe rt2800usb
          echo "Verifying..."
          lsmod | grep rt2x00
          ip link show wlan1 2>/dev/null && echo "SUCCESS: wlan1 interface created!" || echo "Check: ip link; dmesg | tail -20"
          INSTALLSCRIPT
          chmod +x "$OUTDIR/install_on_edison.sh"

      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt2800usb-modules-${{ steps.vars.outputs.kernel_version }}
          path: output/
          retention-days: 30
